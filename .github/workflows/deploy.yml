name: Deploy

on:
  workflow_run:
    workflows:
      - CI Build Test Publish
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy monitoring node
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy monitoring EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MONITORING_EC2_HOST }}
          username: ${{ secrets.MONITORING_EC2_USER }}
          key: ${{ secrets.MONITORING_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            log() { echo "[INFO] $*"; }
            warn() { echo "[WARN] $*"; }

            REPO_PATH="${{ secrets.MONITORING_REPO_PATH }}"
            if [ -z "$REPO_PATH" ]; then REPO_PATH="$HOME/sentinelstack"; fi
            export REPO_PATH
            sudo -i env REPO_PATH="$REPO_PATH" bash <<'EOF'
            set -euo pipefail
            log() { echo "[INFO] $*"; }
            warn() { echo "[WARN] $*"; }

            if [ ! -d "$REPO_PATH/.git" ]; then
              log "Cloning SentinelStack into $REPO_PATH"
              git clone https://github.com/${{ github.repository }}.git "$REPO_PATH"
            else
              log "Updating SentinelStack in $REPO_PATH"
              cd "$REPO_PATH"
              git pull origin main
            fi

            cd "$REPO_PATH"
            chmod +x scripts/*.sh
            log "Starting monitoring stack"
            ./scripts/start-monitoring-node.sh "${{ secrets.APP_PRIVATE_IP }}"
            log "Running advisory monitoring health checks"
            if ./scripts/check-monitoring-node.sh; then
              log "Monitoring checks passed"
            else
              status=$?
              if [ "$status" -eq 2 ]; then
                echo "[FATAL] Monitoring check found Docker-level failure"
                exit "$status"
              fi
              warn "Monitoring checks reported non-fatal readiness warnings/failures; continuing to app deployment"
            fi
            EOF

  deploy-app:
    name: Deploy app node
    runs-on: ubuntu-latest
    needs:
      - deploy-monitoring
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy app EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_EC2_HOST }}
          username: ${{ secrets.APP_EC2_USER }}
          key: ${{ secrets.APP_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            log() { echo "[INFO] $*"; }

            REPO_PATH="${{ secrets.APP_REPO_PATH }}"
            if [ -z "$REPO_PATH" ]; then REPO_PATH="$HOME/sentinelstack"; fi
            export REPO_PATH
            sudo -i env REPO_PATH="$REPO_PATH" GHCR_OWNER="${{ github.repository_owner }}" IMAGE_TAG="latest" bash <<'EOF'
            set -euo pipefail
            log() { echo "[INFO] $*"; }

            if [ ! -d "$REPO_PATH/.git" ]; then
              log "Cloning SentinelStack into $REPO_PATH"
              git clone https://github.com/${{ github.repository }}.git "$REPO_PATH"
            else
              log "Updating SentinelStack in $REPO_PATH"
              cd "$REPO_PATH"
              git pull origin main
            fi

            cd "$REPO_PATH"
            chmod +x scripts/*.sh
            log "Starting app stack"
            ./scripts/start-app-node.sh "${{ secrets.MONITORING_PRIVATE_IP }}"
            log "Running app health checks"
            ./scripts/check-app-node.sh "${{ secrets.MONITORING_PRIVATE_IP }}"
            EOF
