name: Deploy

on:
  workflow_run:
    workflows:
      - CI Build Test Publish
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy monitoring node
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy monitoring EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MONITORING_EC2_HOST }}
          username: ${{ secrets.MONITORING_EC2_USER }}
          key: ${{ secrets.MONITORING_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            info() { echo "[INFO] $*"; }
            warn() { echo "[WARN] $*"; }
            fatal() { echo "[FATAL] $*" >&2; exit 1; }

            if [ "$(id -un)" = "root" ]; then
              fatal "Deployment must run as the SSH user, not root."
            fi

            REPO_PATH="${{ secrets.MONITORING_REPO_PATH }}"
            if [ -z "$REPO_PATH" ]; then REPO_PATH="$HOME/sentinelstack"; fi
            export REPO_PATH

            sync_repo() {
              local repo_path="$1"
              local repo_url="$2"

              if [ -z "${repo_path}" ] || [ "${repo_path}" = "/" ]; then
                fatal "Refusing to deploy into unsafe REPO_PATH='${repo_path}'"
              fi

              if [ -d "${repo_path}" ] && [ ! -w "${repo_path}" ]; then
                warn "Repository path is not writable by $(id -un); fixing ownership once."
                sudo chown -R "$(id -u):$(id -g)" "${repo_path}"
              fi

              if [ -d "${repo_path}/.git" ] && { [ ! -w "${repo_path}/.git" ] || { [ -e "${repo_path}/.git/FETCH_HEAD" ] && [ ! -w "${repo_path}/.git/FETCH_HEAD" ]; }; }; then
                warn "Git metadata is not writable by $(id -un); fixing ownership once."
                sudo chown -R "$(id -u):$(id -g)" "${repo_path}"
              fi

              if [ ! -d "${repo_path}" ]; then
                info "Cloning SentinelStack into ${repo_path} as $(id -un)"
                git clone "${repo_url}" "${repo_path}"
              fi

              if [ ! -d "${repo_path}" ]; then
                fatal "Repository directory does not exist after clone: ${repo_path}"
              fi

              if [ ! -d "${repo_path}/.git" ]; then
                fatal "Directory exists but is not a git repository: ${repo_path}"
              fi

              cd "${repo_path}"

              # EC2 nodes are deployment targets only. Force-sync to origin/main so
              # server-side edits, generated files, and stale artifacts never block CI/CD.
              info "Fetching origin/main"
              git fetch origin main
              info "Resetting working tree to origin/main"
              git reset --hard origin/main
              info "Removing untracked files created during previous deployments"
              git clean -fd
            }

            sync_repo "$REPO_PATH" "https://github.com/${{ github.repository }}.git"

            cd "$REPO_PATH"
            chmod +x scripts/*.sh
            info "Starting monitoring stack"
            ./scripts/start-monitoring-node.sh "${{ secrets.APP_PRIVATE_IP }}"
            info "Running advisory monitoring health checks"
            if ./scripts/check-monitoring-node.sh; then
              info "Monitoring checks passed"
            else
              status=$?
              if [ "$status" -eq 2 ]; then
                echo "[FATAL] Monitoring check found Docker-level failure"
                exit "$status"
              fi
              warn "Monitoring checks reported non-fatal readiness warnings/failures; continuing to app deployment"
            fi

  deploy-app:
    name: Deploy app node
    runs-on: ubuntu-latest
    needs:
      - deploy-monitoring
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy app EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_EC2_HOST }}
          username: ${{ secrets.APP_EC2_USER }}
          key: ${{ secrets.APP_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            info() { echo "[INFO] $*"; }
            warn() { echo "[WARN] $*"; }
            fatal() { echo "[FATAL] $*" >&2; exit 1; }

            if [ "$(id -un)" = "root" ]; then
              fatal "Deployment must run as the SSH user, not root."
            fi

            REPO_PATH="${{ secrets.APP_REPO_PATH }}"
            if [ -z "$REPO_PATH" ]; then REPO_PATH="$HOME/sentinelstack"; fi
            export REPO_PATH
            export GHCR_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="latest"

            sync_repo() {
              local repo_path="$1"
              local repo_url="$2"

              if [ -z "${repo_path}" ] || [ "${repo_path}" = "/" ]; then
                fatal "Refusing to deploy into unsafe REPO_PATH='${repo_path}'"
              fi

              if [ -d "${repo_path}" ] && [ ! -w "${repo_path}" ]; then
                warn "Repository path is not writable by $(id -un); fixing ownership once."
                sudo chown -R "$(id -u):$(id -g)" "${repo_path}"
              fi

              if [ -d "${repo_path}/.git" ] && { [ ! -w "${repo_path}/.git" ] || { [ -e "${repo_path}/.git/FETCH_HEAD" ] && [ ! -w "${repo_path}/.git/FETCH_HEAD" ]; }; }; then
                warn "Git metadata is not writable by $(id -un); fixing ownership once."
                sudo chown -R "$(id -u):$(id -g)" "${repo_path}"
              fi

              if [ ! -d "${repo_path}" ]; then
                info "Cloning SentinelStack into ${repo_path} as $(id -un)"
                git clone "${repo_url}" "${repo_path}"
              fi

              if [ ! -d "${repo_path}" ]; then
                fatal "Repository directory does not exist after clone: ${repo_path}"
              fi

              if [ ! -d "${repo_path}/.git" ]; then
                fatal "Directory exists but is not a git repository: ${repo_path}"
              fi

              cd "${repo_path}"

              # EC2 nodes are deployment targets only. Force-sync to origin/main so
              # server-side edits, generated files, and stale artifacts never block CI/CD.
              info "Fetching origin/main"
              git fetch origin main
              info "Resetting working tree to origin/main"
              git reset --hard origin/main
              info "Removing untracked files created during previous deployments"
              git clean -fd
            }

            sync_repo "$REPO_PATH" "https://github.com/${{ github.repository }}.git"

            cd "$REPO_PATH"
            chmod +x scripts/*.sh
            info "Starting app stack"
            ./scripts/start-app-node.sh "${{ secrets.MONITORING_PRIVATE_IP }}"
            info "Running app health checks"
            ./scripts/check-app-node.sh "${{ secrets.MONITORING_PRIVATE_IP }}"
