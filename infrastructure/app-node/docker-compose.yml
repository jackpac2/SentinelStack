name: sentinelstack_app_node

# Generated configs must exist before this stack starts.
# Run scripts/generate-app-configs.sh and edit config.yml.template, not config.yml.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sentinelstack-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: sentinelstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../app/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../app/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    image: ghcr.io/${GHCR_OWNER}/sentinelstack-backend:${IMAGE_TAG:-latest}
    container_name: sentinelstack-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    image: ghcr.io/${GHCR_OWNER}/sentinelstack-frontend:${IMAGE_TAG:-latest}
    container_name: sentinelstack-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sentinelstack-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - app_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: sentinelstack-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - app_network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: sentinelstack-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    environment:
      NODE_NAME: ${NODE_NAME:-app-node}
    volumes:
      - ./configs/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  promtail_positions:
